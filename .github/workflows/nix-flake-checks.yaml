name: nix flake

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c  # v31.10.7
      - name: nix flake check
        run: nix flake check --option keep-going true
      - name: evaluate NixOS configurations
        run: >-
          nix eval --json .#nixosConfigurations
          --apply 'builtins.mapAttrs (_: c: c.config.system.build.toplevel.drvPath)'
